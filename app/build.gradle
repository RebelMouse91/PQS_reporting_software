plugins {
    id 'com.android.application'
}

// Без постоянного ключа Gradle подписывает APK стандартным debug-ключом, который на
// каждом прогоне CI новый — такой APK не встаёт поверх предыдущего, только с удалением
// приложения и его данных. Ключ из signing/ используется по умолчанию; секреты
// репозитория, если заданы все четыре, имеют приоритет.
def envKsPath = System.getenv("PQS_KEYSTORE_FILE")
def envKsPass = System.getenv("PQS_KEYSTORE_PASSWORD")
def envKsAlias = System.getenv("PQS_KEY_ALIAS")
def envKsKeyPass = System.getenv("PQS_KEY_PASSWORD")
def useEnvKey = envKsPath && envKsPass && envKsAlias && envKsKeyPass && file(envKsPath).exists()

def ksPath = useEnvKey ? envKsPath : rootProject.file("signing/pqs.keystore").path
def ksPass = useEnvKey ? envKsPass : "pqsapp"
def ksAlias = useEnvKey ? envKsAlias : "pqs"
def ksKeyPass = useEnvKey ? envKsKeyPass : "pqsapp"
def useStableSigning = file(ksPath).exists()

// Номер сборки CI попадает в версию, чтобы установленную версию можно было отличить.
def ciRun = System.getenv("GITHUB_RUN_NUMBER")

android {
    namespace 'com.uchet.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.uchet.app"
        minSdk 24
        targetSdk 34
        versionCode ciRun ? ciRun.toInteger() : 1
        versionName ciRun ? "1.0.${ciRun}" : "1.0"
    }

    if (useStableSigning) {
        signingConfigs {
            stable {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (useStableSigning) {
                signingConfig signingConfigs.stable
            }
        }
        debug {
            if (useStableSigning) {
                signingConfig signingConfigs.stable
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    // старые kotlin-stdlib-jdk7/jdk8 (тянутся транзитивно некоторыми androidx-библиотеками)
    // дублируют классы, которые с Kotlin 1.8 уже включены прямо в kotlin-stdlib
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
