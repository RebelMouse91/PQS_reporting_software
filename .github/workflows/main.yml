          if [ -f index.html ]; then
            cp index.html app/src/main/assets/index.html
            echo "Взят index.html из корня репозитория."
          else
            echo "index.html в корне нет, используется версия из проекта."
          fi
          echo "=== файлы проекта ==="
          find . -path ./.git -prune -o -type f -print | sort
          for f in settings.gradle build.gradle app/build.gradle \
                   app/src/main/AndroidManifest.xml app/src/main/assets/index.html; do
            if [ ! -f "$f" ]; then echo "ОШИБКА: нет файла $f"; exit 1; fi
          done
          echo "Все нужные файлы на месте."

      - name: Поставить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Поставить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Собрать APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Что собралось
        if: always()
        run: find . -name '*.apk' -print || echo "APK не найден"

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: kniga-ucheta-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
