          rm project.zip
          if [ -f index.html ]; then
            cp index.html app/src/main/assets/index.html
            echo "Взят index.html из корня репозитория."
          fi
          for f in settings.gradle build.gradle app/build.gradle \
                   app/src/main/AndroidManifest.xml app/src/main/assets/index.html; do
            if [ ! -f "$f" ]; then echo "ОШИБКА: нет файла $f"; exit 1; fi
          done
          echo "Все нужные файлы на месте."

      - name: Поставить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Поставить Android SDK
        uses: android-actions/setup-android@v3

      - name: Доставить нужные части SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Поставить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Собрать APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Последние строки лога
        if: failure()
        run: |
          echo "================ КОНЕЦ ЛОГА ================"
          tail -n 150 build.log || echo "лог не создан"

      - name: Выложить лог сборки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-sborki
          path: build.log
          if-no-files-found: ignore

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: kniga-ucheta-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
